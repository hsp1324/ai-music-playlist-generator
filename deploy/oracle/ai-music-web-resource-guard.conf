[Service]
# Keep a runaway web request from exhausting the 1 GiB VM and taking SSH down.
# After a day of uptime this app had grown beyond 380 MiB RSS; a 300 MiB
# soft limit caused sustained direct reclaim and stalled HTTP responses.
# Keep the hard cap below, but do not throttle ordinary web traffic.
MemoryHigh=infinity
MemoryMax=440M
# Keep a bounded swap allowance, but leave enough room to reclaim RAM.
# At 256 MiB this cgroup hit its swap cap despite gigabytes of free host swap.
MemorySwapMax=512M
TasksMax=128
ExecStart=
ExecStart=/opt/ai-music-playlist-generator/.venv/bin/uvicorn app.main:app --host 127.0.0.1 --port 8000 --no-access-log --limit-concurrency 32 --backlog 128
